openapi: 3.0.3
info:
  title: Fixture charges
  version: "2.0.0"
paths:
  /v1/charges:
    post:
      operationId: createCharge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCharge"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charge"
components:
  schemas:
    CreateCharge:
      type: object
      required: [amountMinor, currency, source]
      properties:
        amountMinor:
          type: integer
        currency:
          type: string
        source:
          type: string
    Charge:
      type: object
      required: [id, currency]
      properties:
        id:
          type: string
        currency:
          type: string
        status:
          type: string
