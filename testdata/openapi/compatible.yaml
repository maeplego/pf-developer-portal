openapi: 3.0.3
info:
  title: Fixture charges
  version: "1.0.1"
paths:
  /v1/charges:
    post:
      operationId: createCharge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCharge"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charge"
  /v1/charges/{chargeId}:
    get:
      operationId: getCharge
      parameters:
        - in: path
          name: chargeId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: charge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charge"
components:
  schemas:
    CreateCharge:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
        currency:
          type: string
        statement:
          type: string
        note:
          type: string
    Charge:
      type: object
      required: [id, amountMinor, currency]
      properties:
        id:
          type: string
        amountMinor:
          type: integer
        currency:
          type: string
        status:
          type: string
        receiptUrl:
          type: string
